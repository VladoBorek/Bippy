image: mcr.microsoft.com/dotnet/sdk:9.0

stages:
  - build
  - test
  - fuzz
  - analyze
  - publish
  - release

variables:
  ANALYZER_IMAGE: "mjolniron/ci-analyzer:latest"
  COVERAGE_MIN_LINE: "80"
  COVERAGE_MIN_BRANCH: "70"
  TRACE_CLI_ARGS: "encode --entropy 78ba6f96c8a70f71c4acff1c9dc7b35d8988734180d9502eeada775b7cca103e --format hex"

# ─── BUILD ───────────────────────────────────────────────────────────────────

build_job:
  stage: build
  tags:
    - shared-fi
  script:
    - dotnet restore
    - dotnet build --configuration Release
  artifacts:
    paths: ["**/bin/Release", "**/obj"]
    expire_in: 2 hours
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ─── TEST + COVERAGE ─────────────────────────────────────────────────────────

test_job:
  stage: test
  tags:
    - shared-fi
  needs: [build_job]
  script:
    - dotnet test --configuration Release -v q --collect:"XPlat Code Coverage" --results-directory ./coverage
    - echo "=== Coverage files ==="
    - find coverage -type f || true
    - test -n "$(find coverage -name 'coverage.cobertura.xml')" || (echo "Coverage file missing" && exit 1)
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/**/coverage.cobertura.xml
    paths: ["coverage/"]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ─── FUZZING  ─────────────────────────────────────────────────────────────────

fuzz_cli:
  stage: fuzz
  image: mcr.microsoft.com/dotnet/sdk:9.0
  allow_failure: true
  tags:
    - shared-fi
  needs:
    - job: build_job
      artifacts: true
  variables:
    AFL_SKIP_CPUFREQ: "1"
    AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
    AFL_NO_UI: "1"
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends afl++ clang make
    - dotnet tool install --global SharpFuzz.CommandLine --version 2.2.0
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet publish ./PV286.Project.Fuzz/PV286.Project.Fuzz.csproj -c Release -o ./fuzz-bin
    - sharpfuzz ./fuzz-bin/BusinessLayer.dll
    - sharpfuzz ./fuzz-bin/ResultPattern.dll
    - mkdir -p ./fuzz-findings
    - set +e
    - timeout 120s afl-fuzz -i ./PV286.Project.Fuzz/Testcases -o ./fuzz-findings -x ./PV286.Project.Fuzz/cli.dict -t 10000 -m none -- dotnet ./fuzz-bin/PV286.Project.Fuzz.dll
    - status=$?
    - set -e
    - if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
    - |
      if find ./fuzz-findings -path "*/crashes/id:*" -type f | grep -q .; then
        echo "WARNING: Fuzzing found crashes. See fuzz-findings artifact."
        find ./fuzz-findings -path "*/crashes/id:*" -type f
      else
        echo "Fuzzing completed without crashes."
      fi
  artifacts:
    when: always
    paths:
      - fuzz-findings/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ─── ANALYZE ─────────────────────────────────────────────────────────────────

coverage_check:
  stage: analyze
  image: $ANALYZER_IMAGE
  tags:
    - shared-fi
  needs:
    - job: test_job
      artifacts: true
  script:
    - echo "=== After artifact download ==="
    - ls -R
    - echo "=== Workspace contents ==="
    - find . -name "*.xml" 2>/dev/null || echo "No XML files found"
    - find ./coverage -type f 2>/dev/null || echo "coverage/ missing"
    - python3 .ci/check-coverage.py
  coverage: '/Line\s*:\s*\d+\.\d+%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

performance_check:
  stage: analyze
  image: $ANALYZER_IMAGE
  tags:
    - shared-fi
  needs:
    - job: build_job
      artifacts: true
  script:
    - echo "=== Setting up environment ==="
    - apt-get update -qq && apt-get install -y linux-perf time wget || echo "Failed to install some tools, continuing..."
    - git clone --depth 1 https://github.com/brendangregg/FlameGraph.git /opt/FlameGraph || echo "FlameGraph already exists"
    - echo "=== Building binary ==="
    - dotnet publish ./PV286-project/PV286-project.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None --output ./release
    - chmod +x ./release/PV286-project
    - echo "=== Running Performance Check ==="
    - chmod +x .ci/check_performance.sh
    - export BINARY="./release/PV286-project"
    - export OUTPUT="./perf_output"
    - export PERF_THRESHOLD="5.0"
    - .ci/check_performance.sh $TRACE_CLI_ARGS
  artifacts:
    when: always
    paths: ["perf_output/"]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ─── PUBLISH ─────────────────────────────────────────────────────────────────

.publish_template: &publish_template
  stage: publish
  tags:
    - shared-fi
  needs: [coverage_check, performance_check]
  rules:
    - if: $CI_COMMIT_TAG

publish_linux:
  <<: *publish_template
  script:
    - dotnet publish ./PV286-project/PV286-project.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None --output ./release
    - mv ./release/PV286-project ./release/Bippy
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file ./release/Bippy \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/myapp/${CI_COMMIT_TAG}/Bippy-linux-x64"

publish_windows:
  <<: *publish_template
  script:
    - dotnet publish ./PV286-project/PV286-project.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None --output ./release
    - mv ./release/PV286-project.exe ./release/Bippy.exe
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file ./release/Bippy.exe \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/myapp/${CI_COMMIT_TAG}/Bippy-win-x64.exe"

# ─── RELEASE ─────────────────────────────────────────────────────────────────

release_job:
  stage: release
  tags:
    - shared-fi
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish_linux
    - job: publish_windows
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Bippy (Linux x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/myapp/${CI_COMMIT_TAG}/Bippy-linux-x64"
        - name: "Bippy (Windows x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/myapp/${CI_COMMIT_TAG}/Bippy-win-x64.exe"
